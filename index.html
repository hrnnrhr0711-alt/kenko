<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朝枠ポイントカード | 人類みなけんこう化計画</title>
  <style>
    :root {
      /* プロフィールサイトと統一したカラーパレット */
      --bg-ice-blue: #f0f7fa;        /* 淡いアイスブルー背景 */
      --card-bg: #ffffff;
      --text-main: #1e293b;          /* スレートダークテキスト */
      --text-muted: #64748b;         /* ミュートテキスト */
      --accent-blue: #0284c7;        /* スカイブルー（プライマリ） */
      --accent-blue-dark: #0369a1;   /* 濃いブルー */
      --accent-blue-light: #e0f2fe;  /* ハイライト・薄水色 */
      --border-blue: #dbeafe;        /* 枠線ブルー */
      --bottom-nav-height: 64px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background-color: var(--bg-ice-blue);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      /* 下部ナビゲーションと重ならないよう余白を確保 */
      padding-bottom: calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 16px) + 24px);
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 22px 20px;
      border: 1px solid var(--border-blue);
      box-shadow: 0 4px 16px rgba(186, 215, 233, 0.25);
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.25rem;
      text-align: center;
      margin-top: 0;
      margin-bottom: 6px;
      color: var(--accent-blue-dark);
      letter-spacing: 0.3px;
      font-weight: 700;
    }

    .info {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 14px;
      font-weight: 500;
    }
    
    /* 敬称略の注記 */
    .keisho {
      font-size: 0.72rem;
      color: #94a3b8;
      text-align: right;
      margin-bottom: 10px;
      padding-right: 4px;
    }

    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .user-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: #f8fafc;
      border: 1px solid #edf2f7;
      border-radius: 14px;
      transition: all 0.2s ease;
    }

    /* 達成者（ハイライト） */
    .user-item.achieved {
      background-color: var(--accent-blue-light);
      border-color: #bae6fd;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .user-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .user-status {
      font-size: 0.75rem;
      color: var(--accent-blue);
      font-weight: 600;
    }

    .user-points {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--accent-blue);
      text-align: right;
      letter-spacing: -0.5px;
    }

    .user-points span {
      font-size: 0.8rem;
      margin-left: 2px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 特典カード */
    .rewards {
      background: #ffffff;
      border: 1px solid var(--border-blue);
    }

    .rewards strong.title {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-blue-dark);
      margin-bottom: 10px;
      font-size: 0.98rem;
      font-weight: 700;
    }

    .rewards ul {
      margin: 0;
      padding-left: 20px;
      line-height: 1.8;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .rewards li strong {
      color: var(--accent-blue-dark);
    }

    .notice {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 14px;
      line-height: 1.6;
      border-top: 1px solid #e2e8f0;
      padding-top: 10px;
    }

    .loading {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 24px 0;
    }

    /* --- フローティング下部ナビゲーション --- */
    .floating-bottom-nav {
      position: fixed;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 480px;
      height: var(--bottom-nav-height);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(219, 234, 254, 0.9);
      border-radius: 22px;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 4px 6px;
      z-index: 150;
    }

    .nav-tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      text-decoration: none;
      cursor: pointer;
      padding: 6px 2px;
      border-radius: 14px;
      color: #64748b;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.2px;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-tab-btn svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      stroke-width: 1.9;
      fill: none;
      transition: transform 0.2s ease, stroke 0.2s ease;
    }

    .nav-tab-btn.active {
      color: #0284c7;
      background: rgba(2, 132, 199, 0.08);
    }

    .nav-tab-btn.active svg {
      transform: scale(1.08);
    }

    /* 準備中トースト通知 */
    .toast-notice {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translate(-50%, -20px);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 300;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toast-notice.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ポイント一覧カード -->
  <div class="card">
    <h1>🌅 朝枠ポイントカード</h1>
    <div class="info" id="season-info">読み込み中...</div>

    <!-- 右端・小さめの敬称略 -->
    <div class="keisho">※敬称略・同点は50音順</div>

    <div class="ranking-list" id="user-list">
      <div class="loading">データを読み込み中...</div>
    </div>
  </div>

  <!-- 特典・ルールカード -->
  <div class="card rewards">
    <strong class="title">🎁 特典ラインナップ</strong>
    <ul>
      <li><strong>350 pt:</strong> ガチャチケット 1枚 🎁</li>
      <li><strong>690 pt:</strong> 1,000コイン還元 ✨</li>
    </ul>

    <div class="notice">
      ・配信日：毎週 月・水・木・金（朝7:00〜8:00）<br>
      ・ポイント：朝枠入室 1回＝1pt / 100コイン応援＝10pt<br>
      ・特典の受け渡し方法は達成時に個別で相談・ご案内します。<br>
      ・最終更新日: <span id="updated-date">-</span>
    </div>
  </div>
</div>

<!-- フローティング下部ナビゲーションバー -->
<nav class="floating-bottom-nav" aria-label="下部ナビゲーション">
  <!-- ホーム（index.html へリンク） -->
  <a href="index.html" class="nav-tab-btn">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    <span>ホーム</span>
  </a>

  <!-- プロフィール（準備中） -->
  <button type="button" class="nav-tab-btn" onclick="showPreparingNotice('プロフィール')">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
    <span>プロフィール</span>
  </button>

  <!-- ポイントカード（現在地アクティブ） -->
  <button type="button" class="nav-tab-btn active" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="5" width="20" height="14" rx="2"></rect>
      <line x1="2" y1="10" x2="22" y2="10"></line>
    </svg>
    <span>ポイント</span>
  </button>

  <!-- レシピ検索（準備中） -->
  <button type="button" class="nav-tab-btn" onclick="showPreparingNotice('レシピ検索')">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <span>レシピ検索</span>
  </button>
</nav>

<!-- 準備中トースト通知 -->
<div id="toastNotice" class="toast-notice">
  <span>🚧 このページは現在準備中です</span>
</div>

<script>
  // トースト通知ロジック
  let toastTimer = null;
  function showPreparingNotice(pageName) {
    const toast = document.getElementById('toastNotice');
    toast.querySelector('span').textContent = `🚧 「${pageName}」は現在準備中です`;
    toast.classList.add('show');

    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 2000);
  }

  // データ取得＆ソート処理
  fetch('data.json')
    .then(res => res.json())
    .then(data => {
      document.getElementById('season-info').innerText = data.season;
      document.getElementById('updated-date').innerText = data.updatedAt;

      const userListEl = document.getElementById('user-list');
      userListEl.innerHTML = '';

      let users = data.users || [];

      // ①ポイント降順
      // ②同点時は読み仮名（kana）ありを優先し50音順
      // ③読み仮名なしは同点の中で最下位
      users.sort((a, b) => {
        if (b.points !== a.points) {
          return b.points - a.points;
        }
        const kanaA = (a.kana || '').trim();
        const kanaB = (b.kana || '').trim();

        if (kanaA && !kanaB) return -1;
        if (!kanaA && kanaB) return 1;
        if (!kanaA && !kanaB) return a.name.localeCompare(b.name, 'ja');

        return kanaA.localeCompare(kanaB, 'ja');
      });

      if (users.length === 0) {
        userListEl.innerHTML = '<div class="loading">登録されているユーザーがいません</div>';
        return;
      }

      users.forEach(user => {
        const item = document.createElement('div');
        const isAchieved = user.points >= 350;
        item.className = `user-item ${isAchieved ? 'achieved' : ''}`;

        item.innerHTML = `
          <div class="user-info">
            <div class="user-name">${user.name}</div>
            ${user.status ? `<div class="user-status">${user.status}</div>` : ''}
          </div>
          <div class="user-points">${user.points}<span>pt</span></div>
        `;

        userListEl.appendChild(item);
      });
    })
    .catch(err => {
      document.getElementById('season-info').innerText = 'データ読み込みエラー';
      document.getElementById('user-list').innerHTML = '<div class="loading">データの取得に失敗しました</div>';
    });
</script>

</body>
</html>
